<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLab</title>
  </head>
  <body>
    <a class="visually-hidden-focusable" href="#contenido">Saltar al contenido</a>

    <div class="app-shell">
      <div class="sidebar">
        <aside class="offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
          <div class="offcanvas-header">
            <h2 class="offcanvas-title h5" id="sidebarLabel">StockLab</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Cerrar menú"></button>
          </div>
          <div class="offcanvas-body">
            <nav class="sidebar__nav" aria-label="Principal">
              <a class="sidebar__link" href="#" aria-current="page">Panel</a>
              <a class="sidebar__link" href="#">Productos</a>
              <a class="sidebar__link" href="#">Pedidos</a>
              <a class="sidebar__link" href="#">Proveedores</a>
              <a class="sidebar__link" href="#">Reportes</a>
            </nav>
          </div>
        </aside>
      </div>

      <div class="app-shell__main">
        <header class="topbar">
          <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas"
            data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Abrir menú">☰</button>
          <input class="form-control topbar__search" id="searchInput" type="search" placeholder="Buscar producto…"
            aria-label="Buscar producto" autocomplete="off">
          <button class="btn btn-outline-secondary ms-auto" id="themeToggle" type="button" aria-pressed="false"
            data-bs-toggle="tooltip" data-bs-title="Cambiar tema" aria-label="Cambiar tema">◐</button>
        </header>

        <main id="contenido" class="container-fluid py-4">
          <!-- Fase 4: KPIs y tabla -->
        </main>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
